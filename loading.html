*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#f3efe6;font-family:'Inter',sans-serif}

#bds-load{position:fixed;inset:0;z-index:10000;overflow:hidden;background:#040406;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 140px;
  transition:opacity .38s ease,visibility 0s linear .38s}
#bds-load.bds-hidden{opacity:0;visibility:hidden;pointer-events:none}

.bdsl-base{position:absolute;inset:0;background:linear-gradient(104deg,#3a1c07 0%,#1b0f08 30%,#0a0709 58%,#000 100%)}
.bdsl-haze{position:absolute;inset:-12%;filter:blur(28px);animation:bdsDrift 18s ease-in-out infinite;
  background:
    radial-gradient(ellipse 58% 62% at 20% 16%,rgba(255,196,142,.44) 0%,rgba(255,150,80,.16) 42%,transparent 66%),
    radial-gradient(ellipse 46% 54% at 6% 78%,rgba(255,122,41,.22) 0%,transparent 64%),
    radial-gradient(ellipse 52% 70% at 66% 96%,rgba(255,77,46,.16) 0%,transparent 60%)}
.bdsl-dark{position:absolute;inset:0;background:radial-gradient(ellipse 70% 120% at 104% 52%,rgba(0,0,0,.92) 0%,rgba(0,0,0,.45) 42%,transparent 68%)}
.bdsl-flute-a{position:absolute;inset:0;mix-blend-mode:soft-light;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0px,rgba(255,255,255,.02) 3px,rgba(0,0,0,.26) 15px,rgba(0,0,0,.10) 24px,rgba(255,255,255,.10) 26px)}
.bdsl-flute-b{position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0px,rgba(255,255,255,0) 2px,rgba(255,255,255,0) 24px,rgba(255,255,255,.055) 26px)}
.bdsl-rule{position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,rgba(255,122,41,0) 0%,#ff9451 22%,#ff7a29 52%,rgba(255,122,41,.25) 100%)}
.bdsl-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.55)}
.bdsl-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(92px,15.5vw,248px);line-height:.82;letter-spacing:.015em;
  color:rgba(248,246,242,.115);filter:blur(1px);user-select:none}

.bdsl-core{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px}
.bdsl-count{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.bdsl-count b{font-size:clamp(62px,9vw,128px);font-weight:300;line-height:1;letter-spacing:-.035em;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 4px 40px rgba(0,0,0,.55)}
.bdsl-count i{font-style:normal;font-size:clamp(20px,2.6vw,36px);font-weight:400;line-height:1;
  color:rgba(255,255,255,.82);padding-bottom:.42em;text-shadow:0 4px 40px rgba(0,0,0,.55)}
.bdsl-word{display:flex;align-items:center;gap:2px;margin-top:14px;font-size:12px;font-weight:600;
  letter-spacing:.56em;text-transform:uppercase;color:#f0ece4;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.bdsl-word span.d{display:flex;gap:.36em;padding-left:.2em}
.bdsl-word span.d i{font-style:normal;animation:bdsDot 1.3s ease-in-out infinite}
.bdsl-word span.d i:nth-child(2){animation-delay:.16s}
.bdsl-word span.d i:nth-child(3){animation-delay:.32s}

.bdsl-bar{width:min(420px,72vw);margin-top:30px}
.bdsl-track{position:relative;height:3px;border-radius:2px;background:rgba(243,239,230,.16);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bdsl-fill{position:absolute;top:0;bottom:0;left:0;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#ff9451,#ff7a29 55%,#ff4d2e);box-shadow:0 0 18px rgba(255,122,41,.7);transition:width .18s linear}
.bdsl-sheen{position:absolute;top:0;bottom:0;width:34%;animation:bdsSheen 2.4s ease-in-out infinite;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.bdsl-meta{display:flex;justify-content:space-between;margin-top:11px;font-size:9.5px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:#a3a09a}
.bdsl-meta span:last-child{font-variant-numeric:tabular-nums}

.bdsl-mark{position:absolute;left:0;right:0;bottom:42px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bdsl-mark img{width:34px;height:34px;object-fit:contain;opacity:.92;filter:drop-shadow(0 4px 16px rgba(255,122,41,.45))}
.bdsl-mark div{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.34em;color:#b8b4ad}

@keyframes bdsDot{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes bdsDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4%,-3%,0) scale(1.08)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes bdsSheen{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@media(prefers-reduced-motion:reduce){.bdsl-haze,.bdsl-sheen,.bdsl-word span.d i{animation:none}}
</style>

<script>
// Runs once: fills to 100%, then hands off to the landing page. Not a drop-in demo loop here —
// this page's only job is the splash-then-forward at "/".
var BDS_SPLASH_MS = 1800;
var BDS_NEXT_URL = '/landing.html';

(function(){
  var CEILING = 92, ov = document.getElementById('bds-load'),
      elPct = document.getElementById('bdsl-pct'), elPct2 = document.getElementById('bdsl-pct2'),
      elFill = document.getElementById('bdsl-fill'), elPhase = document.getElementById('bdsl-phase');
  var pct = 0, exact = 0, reported = null, settled = false, raf = null, timer = null;

  function phase(){
    if(pct >= 100) return 'Ready';
    if(settled) return 'Opening';
    if(pct < 20) return 'Connecting';
    if(pct < 50) return 'Reading database';
    if(pct < 80) return 'Syncing schedule';
    return 'Waiting for database';
  }
  function paint(n){
    if(n === pct) return;
    pct = n;
    elPct.textContent = elPct2.textContent = n;
    elFill.style.width = n + '%';
    elPhase.textContent = phase();
  }
  function creep(){
    raf = requestAnimationFrame(function step(){
      if(settled) return;
      var target = reported != null ? reported : CEILING;
      exact += (target - exact) * 0.022;
      paint(Math.min(Math.floor(exact), 99));
      raf = requestAnimationFrame(step);
    });
  }

  var api = {
    reset: function(){
      cancelAnimationFrame(raf); clearTimeout(timer);
      reported = null; exact = 0; settled = false; paint(0);
      creep();
      timer = setTimeout(api.done, Math.max(400, BDS_SPLASH_MS));
    },
    show: function(){ ov.classList.remove('bds-hidden'); ov.setAttribute('aria-busy','true'); },
    hide: function(){ ov.classList.add('bds-hidden'); ov.setAttribute('aria-busy','false'); },
    progress: function(p){
      var n = Number(p);
      if(isFinite(n)) reported = Math.max(0, Math.min(99, n));
    },
    /* Fills to 100%, then navigates to the landing page. */
    done: function(){
      if(settled) return;
      settled = true;
      cancelAnimationFrame(raf); clearTimeout(timer);
      var from = pct, t0 = performance.now();
      raf = requestAnimationFrame(function step(t){
        var k = Math.min(1, (t - t0) / 420);
        paint(Math.round(from + (100 - from) * (1 - Math.pow(1 - k, 3))));
        if(k < 1) raf = requestAnimationFrame(step);
        else timer = setTimeout(function(){ location.replace(BDS_NEXT_URL); }, 260);
      });
    }
  };

  window.BDSLoading = api;
  api.reset();
})();
</script>
